name: The ordered pipeline

on:
    push:
    
    workflow_dispatch:


jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v4
            
            - name: Setup runtime
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            
            - name: Final message
              run: echo "Setup done"

            - name: Deliberate failure
              run: exit 1

            
    verify: 
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Runtime version 
              run: echo "the python version $(python --version)"

            - name: final
              run: echo "Verify done"




    finish:
        runs-on: ubuntu-latest
        needs: verify

        steps:
            - name: Pipeline finished
              run: echo "Pipeline finished"