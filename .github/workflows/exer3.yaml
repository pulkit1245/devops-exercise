name: The Python inspector


on:
    push:
    
    workflow_dispatch:


jobs:
    inspect:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout the repository
              uses: actions/checkout@v4

            - name: Setup python version 
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'

            - name: Print version 
              run: |
                python3 --version
                pip3 --version 
            
            - name: Print python binary 
              run: which python 

            - name: Finishing message
              run: echo "Inspection complete "